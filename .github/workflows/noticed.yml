name: Noticed

# Dedicated CI for apps/mental-load-tracker. Every job below is a merge
# gate: lint, type-check, application tests, the production build, the
# Supabase SQL suites, the two-client security integration suite, and the
# Playwright E2E run all block.

on:
  push:
    paths:
      - "apps/mental-load-tracker/**"
      - ".github/workflows/noticed.yml"
  pull_request:
    paths:
      - "apps/mental-load-tracker/**"
      - ".github/workflows/noticed.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: apps/mental-load-tracker

jobs:
  verify:
    name: Lint, type-check, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mental-load-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mental-load-tracker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Application tests (static guarantees + reliability units)
        run: npm run test:app
      - name: Build
        run: npm run build

  integration:
    name: Supabase DB, security, and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mental-load-tracker
    env:
      SUPABASE_TEST_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      E2E_BASE_URL: http://127.0.0.1:3100
      E2E_TEST_EMAIL: e2e-owner@example.test
      E2E_TEST_PASSWORD: E2e-owner-password-123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mental-load-tracker/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install dependencies
        run: npm ci
      - name: Start local Supabase stack
        run: supabase start
        working-directory: apps/mental-load-tracker/supabase
      - name: Export local keys
        working-directory: apps/mental-load-tracker/supabase
        run: |
          supabase status -o json > status.json
          {
            echo "SUPABASE_TEST_ANON_KEY=$(jq -r '.ANON_KEY // .anon_key' status.json)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r '.SERVICE_ROLE_KEY // .service_role_key' status.json)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r '.ANON_KEY // .anon_key' status.json)"
          } >> "$GITHUB_ENV"
      - name: Apply migration twice (idempotence proof)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f supabase/migrations/20260820000000_secure_households.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - name: SQL security suites (pgTAP)
        run: supabase test db
        working-directory: apps/mental-load-tracker/supabase
      - name: Security integration tests (cross-household, invites, realtime, lifecycle)
        run: npm run test:security
      - name: Seed E2E owner account
        run: |
          node --input-type=module -e "
            import { createClient } from '@supabase/supabase-js';
            const admin = createClient(
              process.env.SUPABASE_TEST_URL,
              process.env.SUPABASE_SERVICE_ROLE_KEY,
              { auth: { autoRefreshToken: false, persistSession: false } },
            );
            const { error } = await admin.auth.admin.createUser({
              email: process.env.E2E_TEST_EMAIL,
              password: process.env.E2E_TEST_PASSWORD,
              email_confirm: true,
            });
            if (error && !/already/i.test(error.message)) throw error;
          "
      - name: Build production bundle
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Serve production build
        run: npm run start -- --port 3100 &
      - name: Wait for server
        run: npx wait-on@7 http://127.0.0.1:3100 -t 60000
      - name: Playwright E2E
        run: npm run test:e2e
