name: Pulse

on:
  push:
    paths:
      - "apps/pulse/**"
      - ".github/workflows/pulse.yml"
  pull_request:
    paths:
      - "apps/pulse/**"
      - ".github/workflows/pulse.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pulse/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - run: node ../../scripts/check-performance-budgets.mjs --require-builds --only=apps/pulse

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pulse/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:ci
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: pulse-playwright-report
          path: apps/pulse/playwright-report/
          retention-days: 7
