name: RTK

on:
  push:
    paths:
      - "apps/rtk/**"
      - ".github/workflows/rtk.yml"
  pull_request:
    paths:
      - "apps/rtk/**"
      - ".github/workflows/rtk.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/rtk
    strategy:
      fail-fast: false
      matrix:
        # Cross-platform quality: every OS runs the full suite; the Node
        # version matrix runs on Linux to keep the matrix bounded.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20]
        include:
          - os: ubuntu-latest
            node: 18
          - os: ubuntu-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: node benchmark/run.js
      - run: node benchmark/families.js
      - run: node benchmark/detection.js
      - run: node benchmark/retention.js
      - run: node benchmark/retention-fields.js
      - run: node benchmark/paired.js --count=250
      - run: node benchmark/levels.js --count=250
      - run: node benchmark/agent-solve.js
      - run: node benchmark/agent-live.js
      - run: node benchmark/perf.js
      - run: node benchmark/corpus-builder.js
      - run: npm pack --dry-run
      - run: ls -lh *.tgz 2>/dev/null | head -n 5 || echo "no tarball (dry-run)"
  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
        working-directory: apps/rtk
      - run: npm publish --access public
        working-directory: apps/rtk
        if: startsWith(github.event.head_commit.message, 'chore(release)')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
