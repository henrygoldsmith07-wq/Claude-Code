name: RTK

on:
  push:
    paths:
      - "apps/rtk/**"
      - ".github/workflows/rtk.yml"
  pull_request:
    paths:
      - "apps/rtk/**"
      - ".github/workflows/rtk.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rtk
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: node benchmark/run.js
      - run: node benchmark/retention.js
      - run: node benchmark/agent-solve.js
      - run: npm pack --dry-run
      - run: ls -lh *.tgz 2>/dev/null | head -n 5 || echo "no tarball (dry-run)"
