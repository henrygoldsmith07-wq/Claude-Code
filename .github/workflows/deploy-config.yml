name: Deploy config

# Every Vercel project here points at a subdirectory via its Root Directory
# setting and reads the vercel.json found there. This job checks that contract
# holds for every app, so a project cannot be left relying on dashboard-only
# settings that nobody can review in a diff.

on:
  push:
    paths:
      - "vercel.json"
      - "apps/*/vercel.json"
      - "apps/*/package.json"
      - "apps/*/package-lock.json"
      - "apps/registry.json"
      - "config/affected-deployments.json"
      - "packages/theme/**"
      - "packages/le-studio-tokens/**"
      - "scripts/check-deploy-config.mjs"
      - "scripts/vercel-ignore.mjs"
      - "scripts/vercel-ignore.test.mjs"
      - "scripts/sync-theme.sh"
      - ".github/workflows/deploy-config.yml"
  pull_request:
    paths:
      - "vercel.json"
      - "apps/*/vercel.json"
      - "apps/*/package.json"
      - "apps/*/package-lock.json"
      - "apps/registry.json"
      - "config/affected-deployments.json"
      - "packages/theme/**"
      - "packages/le-studio-tokens/**"
      - "scripts/check-deploy-config.mjs"
      - "scripts/vercel-ignore.mjs"
      - "scripts/vercel-ignore.test.mjs"
      - "scripts/sync-theme.sh"
      - ".github/workflows/deploy-config.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-deploy-config.mjs
      - run: node --test scripts/vercel-ignore.test.mjs
      - run: bash scripts/sync-theme.sh --check
      - run: node packages/le-studio-tokens/check-tokens.mjs
