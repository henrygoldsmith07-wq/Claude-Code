name: Arise

on:
  push:
    paths:
      - "apps/arise/**"
      - ".github/workflows/arise.yml"
  pull_request:
    paths:
      - "apps/arise/**"
      - ".github/workflows/arise.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/arise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/arise/package-lock.json
      - run: npm ci
      - run: npm run lint:content
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - run: du -sh .next 2>/dev/null || du -sh dist 2>/dev/null || du -sh build 2>/dev/null || echo "no build artifact to measure"
      - run: node -e "const fs=require('fs');try{const s=require('child_process').execSync('du -sk .next 2>/dev/null || du -sk dist 2>/dev/null || echo 0',{encoding:'utf8'}).trim();console.log('SIZE_KB:'+s.split(/\\s+/)[0])}catch(e){console.log('size check skipped')}"
