name: Engineering gates

# Deliberately unfiltered. GitHub reports no status at all for a workflow that
# a `paths:` filter excludes, and a required check that is never reported leaves
# the pull request blocked on a status that can never arrive. Every job below is
# therefore unconditional, which is what makes this workflow safe to require.
# See docs/branch-protection.md.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/engineering-gates.mjs

  # integration-contracts (revise / forq) moved to the apps' standalone repos
  # on 2026-08-21 and were dropped from required status checks accordingly.
