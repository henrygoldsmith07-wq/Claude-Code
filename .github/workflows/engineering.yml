name: Engineering gates

# Deliberately unfiltered. GitHub reports no status at all for a workflow that
# a `paths:` filter excludes, and a required check that is never reported leaves
# the pull request blocked on a status that can never arrive. Every job below is
# therefore unconditional, which is what makes this workflow safe to require.
# See docs/branch-protection.md.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/engineering-gates.mjs

  integration-contracts:
    name: integration-contracts (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: revise-content-and-ai
            path: apps/revise
            test: npm test -- --run tests/content-schema.test.ts tests/ai-structured-output.test.ts
          - name: forq-cloud-and-migrations
            path: apps/food-shopping-os
            test: npm test -- --run tests/cloud-data-integration.test.js tests/migration-runner.test.js
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json
      - run: npm ci
      - run: ${{ matrix.test }}
