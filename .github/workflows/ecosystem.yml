name: Ecosystem

on:
  push:
    paths:
      - "apps/ecosystem-shell/**"
      - "apps/food-shopping-os/**"
      - "apps/french-practice/**"
      - "apps/pulse/**"
      - "apps/rapport/**"
      - "apps/revise/**"
      - "scripts/ecosystem-*.mjs"
      - ".github/workflows/ecosystem.yml"
  pull_request:
    paths:
      - "apps/ecosystem-shell/**"
      - "apps/food-shopping-os/**"
      - "apps/french-practice/**"
      - "apps/pulse/**"
      - "apps/rapport/**"
      - "apps/revise/**"
      - "scripts/ecosystem-*.mjs"
      - ".github/workflows/ecosystem.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ecosystem-smoke.mjs
      - run: node --test scripts/ecosystem-rollback.test.mjs apps/ecosystem-shell/tests/storage-collision.test.mjs

  app-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: pulse
            path: apps/pulse
            install: npm ci
            verify: npm run type-check && npm test -- --run tests/source-history.test.ts tests/ecosystem-contracts.test.ts tests/ecosystem-e2e.test.ts
          - app: rapport
            path: apps/rapport
            install: npm ci
            verify: npm run type-check && npm test -- --run tests/pulse-history.test.ts
          - app: revise
            path: apps/revise
            install: npm ci
            verify: npm run type-check && npm test -- --run
          - app: french-practice
            path: apps/french-practice
            install: npm ci
            verify: npm test
          - app: forq
            path: apps/food-shopping-os
            install: npm ci
            verify: npm run build && npm test -- --run tests/typography.test.js tests/shopping-flows.test.jsx tests/recipe-library-flows.test.jsx
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ${{ matrix.install }}
      - run: ${{ matrix.verify }}
