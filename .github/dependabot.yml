version: 2
updates:
  # Each app has its own lockfile; group patch/minor to avoid PR flood
  - package-ecosystem: npm
    directory: "/apps/arise"
    schedule: { interval: weekly, day: monday, time: "06:00" }
    groups:
      npm-patch-minor: { patterns: ["*"], update-types: ["minor", "patch"] }
    open-pull-requests-limit: 5
