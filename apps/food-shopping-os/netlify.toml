# Requires the site's base directory to be apps/food-shopping-os.
# `ignore` skips builds when nothing under this app changed (e.g.
# knowledge-base-only commits to raw/, wiki/, output/). Exit 0 = skip.
#
# No SPA redirect rule on purpose: the app is a single page with no client-side
# router, and vite builds with `base: './'` (relative asset URLs), so rewriting
# unknown paths to /index.html would break asset resolution.
[build]
  command = "npm run build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self)"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Cross-Origin-Opener-Policy = "same-origin"
