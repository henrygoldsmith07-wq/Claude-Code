<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Pulse — privacy-first personal analytics and experimentation engine." />
    <title>Pulse</title>
    <link rel="icon" href="/logo.svg" />
  </head>
  <body>
    <!--
      The fallback below is markup, not JavaScript, so it paints as soon as the
      HTML arrives. React replaces it on first render. It is here because the
      demo generates and scans 180 days of synthetic events before it can render
      anything: without it, the deployed page is blank for the whole boot.
    -->
    <div id="root">
      <div class="boot" role="status">
        <img src="/logo.svg" alt="" width="28" height="28" class="boot__logo" />
        <h1>Pulse</h1>
        <p>Generating a synthetic person and scanning them for relationships. This runs entirely in your browser, so it takes a few seconds.</p>
      </div>
    </div>
    <noscript>
      <p>Pulse does all of its analysis in the browser, so it needs JavaScript enabled.</p>
    </noscript>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
